name: Automated Dummy Data Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test-automation:
    runs-on: ubuntu-latest
    env:
      E2E_SUPABASE_EMAIL: ${{ secrets.E2E_SUPABASE_EMAIL }}
      E2E_SUPABASE_PASSWORD: ${{ secrets.E2E_SUPABASE_PASSWORD }}
      E2E_BASE_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Generate fixtures
        run: npm run test:fixtures

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &

      - name: Wait for preview server
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4173 > /dev/null; then
              echo "Preview server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Preview server did not start"
          cat /tmp/preview.log
          exit 1

      - name: Run logic tests
        id: logic
        run: |
          set +e
          npm run test:logic
          EXIT_CODE=$?
          echo "LOGIC_EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV
          exit 0

      - name: Run e2e tests
        id: e2e
        run: |
          set +e
          npm run test:e2e
          EXIT_CODE=$?
          echo "E2E_EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV
          exit 0

      - name: Build test report
        if: always()
        run: npm run test:report

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-test-artifacts
          path: |
            tests/artifacts/latest
            tests/artifacts/raw

      - name: Fail if any suite failed
        if: always()
        run: |
          LOGIC_EXIT_CODE=${LOGIC_EXIT_CODE:-0}
          E2E_EXIT_CODE=${E2E_EXIT_CODE:-0}

          echo "Logic exit: $LOGIC_EXIT_CODE"
          echo "E2E exit: $E2E_EXIT_CODE"

          if [ "$LOGIC_EXIT_CODE" -ne 0 ] || [ "$E2E_EXIT_CODE" -ne 0 ]; then
            exit 1
          fi

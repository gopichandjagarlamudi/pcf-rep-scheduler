<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCF Rep Scheduler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            boxShadow: {
              panel: '0 20px 45px -28px rgba(15, 23, 42, 0.35)',
              soft: '0 14px 30px -24px rgba(15, 23, 42, 0.4)',
              glow: '0 18px 40px -26px rgba(99, 102, 241, 0.55)',
            },
            borderRadius: {
              panel: '24px',
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg-canvas: #f4f6fb;
        --bg-canvas-deep: #eef2ff;
        --surface-base: rgba(255, 255, 255, 0.82);
        --surface-card: rgba(255, 255, 255, 0.92);
        --surface-soft: rgba(247, 248, 252, 0.9);
        --surface-muted: rgba(241, 245, 249, 0.92);
        --border-subtle: rgba(148, 163, 184, 0.18);
        --border-strong: rgba(148, 163, 184, 0.26);
        --text-strong: #0f172a;
        --text-primary: #1e293b;
        --text-muted: #64748b;
        --text-faint: #94a3b8;
        --accent: #6366f1;
        --accent-strong: #4f46e5;
        --accent-soft: rgba(99, 102, 241, 0.12);
        --accent-glow: rgba(99, 102, 241, 0.24);
        --success-soft: rgba(34, 197, 94, 0.12);
        --warning-soft: rgba(245, 158, 11, 0.14);
        --danger-soft: rgba(239, 68, 68, 0.12);
        --shadow-panel: 0 20px 45px -28px rgba(15, 23, 42, 0.35);
        --shadow-soft: 0 14px 30px -24px rgba(15, 23, 42, 0.4);
        --shadow-glow: 0 18px 40px -26px rgba(99, 102, 241, 0.55);
        --radius-panel: 24px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background:
          radial-gradient(circle at top left, rgba(129, 140, 248, 0.16), transparent 24%),
          radial-gradient(circle at top right, rgba(148, 163, 184, 0.14), transparent 22%),
          linear-gradient(180deg, #f7f9fc 0%, var(--bg-canvas) 56%, #eef2f8 100%);
      }

      body {
        margin: 0;
        font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(99, 102, 241, 0.1), transparent 20%),
          radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.72), transparent 24%),
          linear-gradient(180deg, #f8faff 0%, var(--bg-canvas) 52%, #eef2f8 100%);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }

      #root {
        min-height: 100vh;
      }

      ::selection {
        background: rgba(99, 102, 241, 0.18);
        color: var(--text-strong);
      }

      .app-shell {
        position: relative;
        min-height: 100vh;
      }

      .app-shell::before,
      .app-shell::after {
        content: "";
        position: fixed;
        inset: auto;
        pointer-events: none;
        z-index: 0;
        filter: blur(12px);
      }

      .app-shell::before {
        top: 72px;
        left: -120px;
        width: 320px;
        height: 320px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.14), transparent 68%);
      }

      .app-shell::after {
        right: -120px;
        bottom: 120px;
        width: 360px;
        height: 360px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(148, 163, 184, 0.14), transparent 72%);
      }

      .dashboard-shell,
      .login-shell {
        position: relative;
        z-index: 1;
      }

      .glass-nav {
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(18px);
        border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      }

      .panel-surface {
        background: var(--surface-card);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-panel);
        backdrop-filter: blur(18px);
      }

      .panel-soft {
        background: var(--surface-soft);
        border: 1px solid rgba(148, 163, 184, 0.12);
      }

      .card-shadow {
        box-shadow: var(--shadow-panel);
      }

      .soft-shadow {
        box-shadow: var(--shadow-soft);
      }

      .accent-text {
        color: var(--accent-strong);
      }

      .accent-ring {
        box-shadow:
          0 0 0 1px rgba(99, 102, 241, 0.16),
          0 0 0 5px rgba(99, 102, 241, 0.08);
      }

      .primary-button {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        box-shadow: var(--shadow-glow);
      }

      .primary-button:hover {
        filter: brightness(1.03);
      }

      .secondary-button {
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.2);
        box-shadow: var(--shadow-soft);
      }

      .field-shell {
        background: rgba(248, 250, 252, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
      }

      .field-shell:focus-within {
        border-color: rgba(99, 102, 241, 0.42);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.72),
          0 0 0 4px rgba(99, 102, 241, 0.08);
      }

      .muted-grid {
        background-image:
          linear-gradient(to right, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
        background-size: 28px 28px;
      }

      .subtle-divider {
        border-color: rgba(148, 163, 184, 0.12);
      }

      .animate-in {
        animation: fadeSlideUp 380ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
